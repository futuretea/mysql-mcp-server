# MySQL host, database port, username, password, and database are not keys
# in this file. Set MYSQL_MCP_HOST, MYSQL_MCP_DB_PORT, MYSQL_MCP_USERNAME,
# MYSQL_MCP_PASSWORD, and MYSQL_MCP_DATABASE in the process environment.
# MYSQL_DSN is ignored.
port: 0
listen: 127.0.0.1
sse_base_url: ""
log_level: info
enabled_tools: []
disabled_tools: []
enabled_domains: []
disabled_domains: []
# Skip only the startup service-account privilege check. Leave false unless a
# least-privilege account is unavailable. A non-empty
# MYSQL_MCP_ALLOW_UNSAFE_DATABASE_ROLE replaces this value. An empty value
# does not, so true stays true.
allow_unsafe_database_role: false

# Output masking is off unless enabled is true and at least one rule is set.
# MYSQL_MCP_MASKING_JSON is not the empty-variable rule above. If the variable
# is present, including when it is empty, configuration load fails even if the
# object below is valid. Leaving the variable unset keeps this object.
# masking:
#   enabled: false
#   placeholder: "[masked]"
#   names: []
#   name_patterns: []
#   values: []
#   value_patterns: []
